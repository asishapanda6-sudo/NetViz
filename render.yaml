# Render.com blueprint — repo push karte hi one-click deploy
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: netviz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 --timeout 0 -b 0.0.0.1:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
